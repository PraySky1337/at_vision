/armor_detector:
  ros__parameters:
    debug: true
    target_frame: odom
    detect_color: "RED"
    binary_thres: 50

    use_pca: true # 使用PCA算法矫正灯条的角点
    use_ba: true # 使用BA优化算法求解装甲板的Yaw角 

    light.min_ratio: 0.0001
    light.max_ratio: 1.0
    light.max_angle: 35.
    light.color_diff_thresh: 30
    armor.min_light_ratio: 0.8
    armor.min_small_center_distance: 0.8
    armor.max_small_center_distance: 3.5
    armor.min_large_center_distance: 3.5
    armor.max_large_center_distance: 8.0
    armor.max_angle: 40.

    classifier_threshold: 0.5
    ignore_classes: ["negative"]

/armor_detector_ov:
  ros__parameters:
    bbox_timeout_s: 0.2
    camera_frame: camera_optical_frame
    debug: true
    detect_color: BLUE
    device_name: AUTO
    device_priorities: GPU,CPU
    draw_latency: true
    drop_out_of_order: true
    enable_multi_thread: true
    enable_pipeline: true
    model_name: armor_tup
    model_path: package://armor_detector_ov/model/opt-1208-001.onnx
    pipeline_num_requests: 4
    pipeline_queue_size: 4
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    roi_clear_on_miss: true
    roi_disable_dist_m: 3.0
    roi_future_tolerance_s: 0.02
    roi_miss_disable_s: 0.12
    roi_scale: 1.
    roi_smooth_alpha: 0.35
    roi_timeout_s: 0.2
    target_frame: odom
    use_ba: true
    use_gpu: false
    use_roi: true
    use_sim_time: false

/armor_solver:
  ros__parameters:
    debug: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    solver:
      bullet_speed: 25.0
      compensator_type: resistance
      controller_delay: 0.050
      gravity: 9.7997
      iteration_times: 20
      max_tracking_v_yaw: 60.0
      min_switching_v_yaw: 1.0
      prediction_delay: 0.0
      resistance: 0.00005 # 验证过
      shooting_range_height: 0.135
      shooting_range_width: 0.135
      side_angle: 10.0
    target_frame: odom
    tracker:
      lost_threshold: 1.0
      matcher_gate: 10.0
      measure_distance_k: 1.0
      outpost:
        measure_distance_k: 0.2
        sigma_a_yaw: 0.5
        sigma_q_xy: 10.0
        sigma_q_z: 1.7
        yaw_log_k: 0.005
      outpost_matcher_gate: 10.0
      sigma_a_xy: 10.0
      sigma_a_yaw: 20.0
      sigma_a_z: 2.0
      sigma_h: 0.8
      sigma_r: 1.0
      tracking_threshold: 5
      yaw_log_k: 0.005
    use_sim_time: false


/camera_node:
  ros__parameters:
    bayer_cvt_color_quality: 1
    bayer_demosaic_method: ''
    camera_info_url: package://rm_bringup/config/camera_info.yaml
    camera_name: camera
    exposure_time: 3000
    force_8bit_pixel_format: true
    gain: 16.7
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    reconnect_interval_ms: 2000
    reconnect_max_attempts: -1
    timestamp_offset_ms: 0
    use_sensor_data_qos: true
    use_sim_time: false
    # Bayer demosaic method for MV_CC_ConvertPixelType:
    #   nearest | bilinear | optimized (Hamilton)
    bayer_demosaic_method: bilinear


/calibration_node:
  ros__parameters:
    base_frame: odom
    board_height: 6
    board_width: 9
    square_size: 0.026
    camera_info_topic: /camera_info
    camera_info_url: ''
    camera_name: camera
    capture_timeout_s: 2.0
    data_dir: ~/rm_calibration_data
    display_fps: 40.0
    enable_preview_window: false
    extrinsic_output_path: ''
    fix_k3: true
    gimbal_frame: ''
    image_ext: jpg
    image_topic: /image_raw
    imu_frame: gimbal_link
    intrinsic_output_path: ''
    jpeg_quality: 95
    max_tf_time_diff: 0.1
    mode: intrinsic
    png_level: 3
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    quality_threshold: 0.1
    required_frames: 20
    target_samples: 25
    tf_timeout_s: 0.2
    use_gripper_translation: true
    use_sim_time: false
    weight_board_angle: 0.3
    weight_board_pose: 0.3
    weight_board_size: 0.2
    weight_corner_quality: 0.3
    weight_image_sharpness: 0.2
    weight_imu_diversity: 0.3
    weight_reprojection_error: 0.4

/rm_gimbal:
  ros__parameters:
    debug: true
    timestamp_offset: 0.006
    target_component_name: armor_detector
    use_planner: false
    use_roll: false
    use_sim_time: false
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable

/pub_video:
  ros__parameters:
    camera_info_url: package://rm_bringup/config/camera_info.yaml
    camera_name: camera
    image_raw:
      enable_pub_plugins:
      - image_transport/compressed
      - image_transport/raw
      format: jpeg
      jpeg_quality: 95
      png_level: 3
      tiff:
        res_unit: inch
        xdpi: -1
        ydpi: -1
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
    use_sim_time: false
    video_path: /home/developer/ws/assets/armor_demo.mp4
