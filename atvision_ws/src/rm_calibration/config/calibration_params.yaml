/calibration_node:
  ros__parameters:
    # TF frames based on URDF: odom -> gimbal_link (IMU), camera_optical_frame from image header
    base_frame: odom
    board_height: 7
    board_width: 10
    calibration_duration: 20.0
    calibration_node:
      preview:
        enable_pub_plugins:
        - image_transport/compressedDepth
        - image_transport/compressed
        - image_transport/raw
        - image_transport/theora
        format: jpeg
        jpeg_quality: 95
        png_level: 3
        tiff:
          res_unit: inch
          xdpi: -1
          ydpi: -1
    camera_info_topic: /camera_info
    camera_info_url: ''
    camera_name: camera
    display_fps: 10.0
    enable_preview_window: false
    imu_frame: gimbal_link
    mode: extrinsic
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    quality_threshold: 0.2
    required_frames: 20
    square_size: 0.015
    target_samples: 25
    use_sim_time: false
    weight_board_angle: 0.3
    weight_board_pose: 0.3
    weight_board_size: 0.2
    weight_corner_quality: 0.3
    weight_image_sharpness: 0.2
    weight_imu_diversity: 0.3
    weight_reprojection_error: 0.4
